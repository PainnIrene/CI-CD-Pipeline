name: Build and Deploy

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - '*.md'
      - '.gitignore'
      - 'docs/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Notify Discord - Started
        run: |
          curl -H "Content-Type: application/json" \
          -X POST \
          -d "{\"embeds\":[{\"title\":\"🚀 Build Started\",\"color\":16776960,\"fields\":[{\"name\":\"Repo\",\"value\":\"${{ github.repository }}\",\"inline\":true},{\"name\":\"Branch\",\"value\":\"${{ github.ref_name }}\",\"inline\":true},{\"name\":\"Author\",\"value\":\"${{ github.actor }}\",\"inline\":true}]}]}" \
          ${{ secrets.DISCORD_WEBHOOK }}

      - name: Check Python syntax
        run: |
          pip install fastapi uvicorn
          python -m py_compile app/main.py
          echo "Syntax OK"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: painirene/ci-cd-pipeline:latest

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            cd /root/ci-cd-pipeline
            docker compose pull
            docker compose up -d
            docker image prune -f

      - name: Notify Discord - Success
        if: success()
        run: |
          curl -H "Content-Type: application/json" \
          -X POST \
          -d "{\"embeds\":[{\"title\":\"✅ Deploy Success\",\"color\":3066993,\"fields\":[{\"name\":\"Repo\",\"value\":\"${{ github.repository }}\",\"inline\":true},{\"name\":\"Branch\",\"value\":\"${{ github.ref_name }}\",\"inline\":true},{\"name\":\"Author\",\"value\":\"${{ github.actor }}\",\"inline\":true}]}]}" \
          ${{ secrets.DISCORD_WEBHOOK }}

      - name: Notify Discord - Failure
        if: failure()
        run: |
          curl -H "Content-Type: application/json" \
          -X POST \
          -d "{\"embeds\":[{\"title\":\"🔥 Deploy Failed\",\"color\":15158332,\"fields\":[{\"name\":\"Repo\",\"value\":\"${{ github.repository }}\",\"inline\":true},{\"name\":\"Branch\",\"value\":\"${{ github.ref_name }}\",\"inline\":true},{\"name\":\"Author\",\"value\":\"${{ github.actor }}\",\"inline\":true}]}]}" \
          ${{ secrets.DISCORD_WEBHOOK }}